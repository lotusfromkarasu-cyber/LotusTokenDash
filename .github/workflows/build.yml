name: Desktop build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Build macOS and Linux too
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select platforms
        id: select
        shell: bash
        run: |
          if [[ '${{ matrix.os }}' == 'windows-latest' || '${{ inputs.all_platforms }}' == 'true' || '${{ github.ref_type }}' == 'tag' ]]; then echo 'build=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.select.outputs.build == 'true'
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.select.outputs.build == 'true'
        with:
          workspaces: source/desktop -> ../../build/rust-target
      - name: Linux libraries
        if: steps.select.outputs.build == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Dependencies
        if: steps.select.outputs.build == 'true'
        run: node tools/tasks.mjs install
      - name: Type and parser tests
        if: steps.select.outputs.build == 'true'
        run: node tools/tasks.mjs test
      - name: Bundle data service
        if: steps.select.outputs.build == 'true'
        run: node tools/tasks.mjs build
      - name: Desktop package
        if: steps.select.outputs.build == 'true'
        run: node tools/smoke.mjs
      - name: Native desktop package
        if: steps.select.outputs.build == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-target
        run: node tools/tasks.mjs desktop --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true'
        with:
          name: LotusTokenDash-${{ runner.os }}
          path: build/rust-target/release/bundle/**/*
          if-no-files-found: error
      - name: Windows portable archive
        if: steps.select.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE 'build/portable/LotusTokenDash'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item 'build/rust-target/release/lotus-token-dash.exe' (Join-Path $portable 'LotusTokenDash.exe')
          Copy-Item 'runtime/desktop/lotus-node-x86_64-pc-windows-msvc.exe' (Join-Path $portable 'lotus-node.exe')
          Copy-Item 'build/service' $portable -Recurse
          Copy-Item 'LICENSE','README.md' $portable
          node tools/native-smoke.mjs (Join-Path $portable 'LotusTokenDash.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $portable -DestinationPath 'build/LotusTokenDash-0.1.2-Windows-x64-portable.zip'
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true' && runner.os == 'Windows'
        with:
          name: LotusTokenDash-Windows-portable
          path: build/LotusTokenDash-0.1.2-Windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true' && always()
        with:
          name: LotusTokenDash-build-metadata-${{ runner.os }}
          path: source/desktop/Cargo.lock
