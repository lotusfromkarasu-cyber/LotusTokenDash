name: LotusTokenDash macOS build
on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Build both Mac architectures
        type: boolean
        default: true
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '13.5'
  LOTUS_BASE_COMMIT: '7fe3621dfb7f7de412f4f0f20cfa41165e442b89'
jobs:
  native:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: source/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/desktop -> ../../build/rust-target
          key: macos-${{ matrix.arch }}
          cache-on-failure: true
      - name: Dependencies
        run: node tools/tasks.mjs install
      - name: Type and data tests
        shell: bash
        run: |
          mkdir -p build/macos-evidence
          node tools/tasks.mjs test 2>&1 | tee build/macos-evidence/tests.log
      - name: Frontend and embedded data service
        run: node tools/tasks.mjs build
      - name: Packaged service checks
        shell: bash
        run: node tools/smoke.mjs 2>&1 | tee build/macos-evidence/service.log
      - name: Native Mac app
        shell: bash
        run: |
          node tools/tasks.mjs desktop --bundles app --target ${{ matrix.target }} 2>&1 | tee build/macos-evidence/compile.log
          cp source/desktop/Cargo.lock build/macos-evidence/Cargo.lock
      - name: Native cold launches and IPC checks
        shell: bash
        run: |
          app='build/rust-target/${{ matrix.target }}/release/bundle/macos/LotusTokenDash.app'
          node tools/native-smoke.mjs "$app/Contents/MacOS/lotus-token-dash" 2>&1 | tee build/macos-evidence/native.log
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/lotus-token-dash" "$app/Contents/MacOS/lotus-node" | tee build/macos-evidence/architecture.txt
          otool -l "$app/Contents/MacOS/lotus-node" > build/macos-evidence/node-load-commands.txt
          node --version > build/macos-evidence/node-version.txt
          tar -czf build/macos-${{ matrix.arch }}.tar.gz -C "$(dirname "$app")" LotusTokenDash.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: build/macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence-${{ matrix.arch }}
          path: build/macos-evidence/
  universal:
    name: Universal Mac installer
    needs: native
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          path: build/downloads
      - name: Assemble and verify universal bundle
        shell: bash
        run: |
          mkdir -p build/inputs/arm64 build/inputs/x64
          tar -xzf build/downloads/macos-app-arm64/macos-arm64.tar.gz -C build/inputs/arm64
          tar -xzf build/downloads/macos-app-x64/macos-x64.tar.gz -C build/inputs/x64
          node tools/macos-package.mjs 2>&1 | tee build/universal-build.log
          hdiutil verify build/macos-release/LotusTokenDash-0.1.6-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LotusTokenDash-macOS-universal
          path: build/macos-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence-universal
          path: build/universal-build.log
